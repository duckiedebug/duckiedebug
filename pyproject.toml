[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-cli"
version = "0.1.0"
description = "A timed command-line tool for symbolic integration."
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[project.scripts]
integration-cli = "integration_cli:main"
